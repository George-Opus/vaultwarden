{{- if and .Values.vaultwarden.adminToken (not .Values.vaultwarden.existingAdminTokenSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.fullname" . }}-admin
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADMIN_TOKEN: {{ .Values.vaultwarden.adminToken | quote }}
{{- end }}
{{- if and .Values.vaultwarden.smtp.enabled .Values.vaultwarden.smtp.username (not .Values.vaultwarden.smtp.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vaultwarden.fullname" . }}-smtp
  labels:
    {{- include "vaultwarden.labels" . | nindent 4 }}
type: Opaque
stringData:
  SMTP_USERNAME: {{ .Values.vaultwarden.smtp.username | quote }}
  SMTP_PASSWORD: {{ .Values.vaultwarden.smtp.password | quote }}
{{- end }}
