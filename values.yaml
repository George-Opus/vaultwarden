replicaCount: 2  # HA possible uniquement avec database.enabled=true (PostgreSQL) et un volume RWX

image:
  repository: vaultwarden/server
  tag: ""            # défaut: appVersion du Chart
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# --- Base de données ---
database:
  # false => SQLite dans /data (forcer replicaCount=1 et strategy Recreate)
  enabled: true
  # Secret contenant l'URI de connexion. Avec CNPG, le Cluster génère
  # automatiquement le secret `<cluster>-app` avec une clé `uri`.
  existingSecret: "vaultwarden-db-app"
  secretKey: "uri"

# --- Configuration Vaultwarden ---
vaultwarden:
  # URL publique, obligatoire pour que les clients fonctionnent correctement
  domain: "https://vaultwarden.georgeop.us"

  # Inscriptions ouvertes ou non
  signupsAllowed: false
  # Domaines email autorisés à s'inscrire même si signupsAllowed=false (séparés par des virgules)
  signupsDomainsWhitelist: ""
  # Autoriser les invitations par les owners d'organisations
  invitationsAllowed: true

  # Page /admin :
  # - désactivée si adminToken et existingAdminTokenSecret sont vides
  # - de préférence un hash argon2 (vaultwarden hash) plutôt qu'un token en clair
  adminToken: ""
  # Ou référencer un Secret existant (clé ADMIN_TOKEN) - prioritaire sur adminToken
  existingAdminTokenSecret: ""

  # Verbosité des logs: trace, debug, info, warn, error
  logLevel: "info"

  # SMTP (facultatif mais recommandé pour invitations / vérification email)
  smtp:
    enabled: false
    host: ""
    port: 587
    security: "starttls"   # starttls | force_tls | off
    from: "vaultwarden@georgeop.us"
    fromName: "Vaultwarden"
    username: ""
    password: ""
    # Ou Secret existant avec les clés SMTP_USERNAME / SMTP_PASSWORD
    existingSecret: ""

  # Variables d'environnement additionnelles (liste de EnvVar bruts)
  extraEnv: []
    # - name: SIGNUPS_VERIFY
    #   value: "true"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  host: vaultwarden.georgeop.us
  tls:
    enabled: true
    secretName: vaultwarden-tls

persistence:
  enabled: true
  # RWX obligatoire si replicaCount > 1 (attachments/sends/icons partagés).
  # Avec Rook-Ceph => StorageClass CephFS (ex: "rook-cephfs" / "cephfs").
  storageClass: "rook-cephfs"
  accessModes:
    - ReadWriteMany
  size: 5Gi
  # existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

livenessProbe:
  httpGet:
    path: /alive
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /alive
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
